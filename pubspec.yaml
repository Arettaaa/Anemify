name: anemify
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  equatable: ^3.0.0
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  camera: ^0.12.1
  tflite_flutter: ^0.12.1
  image: ^4.12.0
  url_launcher: ^6.3.2
  lottie: ^3.6.1
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  lucide_icons_flutter: ^4.0.1
  flutter_svg: ^2.3.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  sqflite_common_ffi: ^2.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
    - assets/foods/
    - assets/config/
    - assets/debug/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true